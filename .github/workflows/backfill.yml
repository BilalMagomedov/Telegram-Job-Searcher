name: Telegram vacancy backfill (one-off)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "UTC calendar day to scan, format YYYY-MM-DD"
        required: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python backfill.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          FOLDER_NAME: ${{ secrets.FOLDER_NAME }}
          BACKFILL_DATE: ${{ inputs.date }}
