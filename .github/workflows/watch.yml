name: Telegram vacancy watch

on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 minutes
  workflow_dispatch: {}       # lets you also trigger it manually from GitHub's UI

permissions:
  contents: write            # needed so the workflow can commit state.json back

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python watch.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          FOLDER_NAME: ${{ secrets.FOLDER_NAME }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Save state
        run: |
          git config user.name "tg-watch-bot"
          git config user.email "tg-watch-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update watch state [skip ci]"
          git push
